# Any OpenAI-compatible provider: OpenAI, OpenRouter (many open models, some free), Together, Groq, vLLM...
#   export PTE_BASE_URL=https://openrouter.ai/api/v1
#   export PTE_WORKER_MODEL=<model id from the provider>
#   export PTE_API_KEY_ENV=OPENROUTER_API_KEY    (name of the env var holding your key)
task: ../tasks/ofdm_channel_estimation_single_slot   # realistic track, see results/RESULTS.md
run_dir: ../runs/openai-compat-seed0
seed: 0

models:
  worker:
    provider: openai
    base_url: ${PTE_BASE_URL:-https://api.openai.com/v1}
    model: ${PTE_WORKER_MODEL:-set-me}
    api_key_env: ${PTE_API_KEY_ENV:-OPENAI_API_KEY}
    temperature: 0.7
    max_tokens: 6000
    price_in_per_mtok: ${PTE_PRICE_IN:-0.0}
    price_out_per_mtok: ${PTE_PRICE_OUT:-0.0}

search:
  generations: 4
  ideas_per_generation: 3
  workers_per_generation: 3
  steps_per_worker: 4
  max_parallel: 2

budget:
  max_usd: 3.0
  max_calls: 300
